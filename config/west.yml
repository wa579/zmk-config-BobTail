manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: na-ka-no
      url-base: https://github.com/na-ka-no

  projects:
    - name: zmk
      remote: cormoran
      revision: main+custom-studio-protocol
      import:
        file: app/west.yml

    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main
      import: true

    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
      import: true

    - name: zmk-pmw3610-driver
      remote: na-ka-no
      revision: main

  self:
    path: config
